# Self-hosted GitLab CE + a GitLab Runner ("the agent" that runs pipeline jobs) on one Docker host.
#
#   cp .env.example .env              # set GITLAB_HOST etc.
#   docker compose up -d              # GitLab takes ~3-5 min on first boot (see `docker compose ps`)
#   # create a runner in the UI, put its glrt-... token in .env as RUNNER_TOKEN, then:
#   docker compose --profile register run --rm runner-register
#
# See README.md for the full walkthrough.

name: gitlab

services:
  gitlab:
    image: gitlab/gitlab-ce:${GITLAB_VERSION:-latest}
    container_name: gitlab
    hostname: ${GITLAB_HOST:-localhost}
    restart: unless-stopped
    shm_size: 256m
    environment:
      # only read on the very first boot (empty data volume); if unset GitLab generates one
      # into /etc/gitlab/initial_root_password instead - see README.md
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD:-}
      GITLAB_OMNIBUS_CONFIG: |
        # The port in external_url is also the port GitLab's nginx listens on inside the
        # container, so it's published 1:1 below - clone URLs and redirects stay correct.
        external_url 'http://${GITLAB_HOST:-localhost}:${GITLAB_HTTP_PORT:-8929}'
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2224}
        # trimmed for a small lab box - built-in metrics stack and container registry off
        prometheus_monitoring['enable'] = false
        registry['enable'] = false
        puma['worker_processes'] = 2
        sidekiq['concurrency'] = 10
    ports:
      - "${GITLAB_HTTP_PORT:-8929}:${GITLAB_HTTP_PORT:-8929}"
      - "${GITLAB_SSH_PORT:-2224}:22"
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    networks:
      - gitlab
    # the image ships its own HEALTHCHECK; just give first boot enough time
    healthcheck:
      test: ["CMD", "/opt/gitlab/bin/gitlab-healthcheck", "--fail", "--max-time", "10"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 5m

  gitlab-runner:
    image: gitlab/gitlab-runner:${RUNNER_VERSION:-latest}
    container_name: gitlab-runner
    restart: unless-stopped
    depends_on:
      gitlab:
        condition: service_healthy
    volumes:
      - runner-config:/etc/gitlab-runner
      # docker executor: job containers are started as siblings on this host's Docker
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gitlab

  # One-shot registration, only run on demand:
  #   docker compose --profile register run --rm runner-register
  # Skips itself if config.toml already has a runner, so re-running it is harmless.
  runner-register:
    image: gitlab/gitlab-runner:${RUNNER_VERSION:-latest}
    profiles: ["register"]
    depends_on:
      gitlab:
        condition: service_healthy
    volumes:
      - runner-config:/etc/gitlab-runner
    networks:
      - gitlab
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_NAME: ${RUNNER_NAME:-docker-runner}
      RUNNER_DEFAULT_IMAGE: ${RUNNER_DEFAULT_IMAGE:-alpine:3}
      GITLAB_HTTP_PORT: ${GITLAB_HTTP_PORT:-8929}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        if grep -qs '^\[\[runners\]\]' /etc/gitlab-runner/config.toml; then
          echo "a runner is already registered in config.toml - nothing to do"
          echo "(to re-register: docker compose down, docker volume rm gitlab_runner-config, then run this again)"
          exit 0
        fi
        [ -n "$$RUNNER_TOKEN" ] || { echo "set RUNNER_TOKEN (glrt-...) in .env first - see README.md" >&2; exit 1; }
        # url/clone-url use the compose service name, not GITLAB_HOST: job containers join the
        # same network (network_mode) and reach GitLab directly, even when GITLAB_HOST is
        # "localhost" (which inside a container means the container itself).
        gitlab-runner register --non-interactive \
          --url "http://gitlab:$$GITLAB_HTTP_PORT" \
          --clone-url "http://gitlab:$$GITLAB_HTTP_PORT" \
          --token "$$RUNNER_TOKEN" \
          --name "$$RUNNER_NAME" \
          --executor docker \
          --docker-image "$$RUNNER_DEFAULT_IMAGE" \
          --docker-network-mode gitlab-net \
          --docker-volumes /cache
        echo "registered - gitlab-runner picks up config.toml changes on its own"

networks:
  gitlab:
    # fixed name so the runner can put job containers on it (--docker-network-mode above)
    name: gitlab-net

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
  runner-config:
