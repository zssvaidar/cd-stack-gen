# Keycloak + PostgreSQL.
#   cp .env.example .env   # then set real passwords
#   docker compose up -d
# Admin console: http://localhost:${KC_HTTP_PORT:-8080}/admin
services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KC_DB_NAME:-keycloak}
      POSTGRES_USER: ${KC_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.4}
    container_name: keycloak
    restart: unless-stopped
    # `start` is production mode; HTTP is enabled because TLS is expected to be
    # terminated in front of it (reverse proxy / ALB). Use `start-dev` for local hacking.
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KC_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD in .env}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD in .env}

      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8080}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}

      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "${KC_HTTP_PORT:-8080}:8080"
      # management interface (health/metrics) - keep it off public interfaces
      - "127.0.0.1:${KC_MGMT_PORT:-9000}:9000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # the image ships without curl/wget, so probe the health endpoint over bash /dev/tcp
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  postgres-data:
