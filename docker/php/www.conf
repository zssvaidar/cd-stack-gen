; Overrides the base image's default pool at
; /usr/local/etc/php-fpm.d/www.conf (Dockerfile copies this over it).
[www]
user = app
group = app

listen = 9000
listen.owner = app
listen.group = app

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; PHP-FPM clears the environment by default (security: a pool can't read the
; master process's env by accident). This container's only process IS the
; app - docker-entrypoint.sh exports the Vault-fetched secrets and then
; execs php-fpm as PID 1, so the master's env *is* the app's env and nothing
; else shares it. clear_env=no lets that env reach getenv() in the workers;
; see docs/vault-secret-injection.md for why this is safe in this container
; specifically (and why it wouldn't be on a shared/multi-tenant host).
clear_env = no

; Access log to stdout so it lands in `docker logs` / the container's log
; driver instead of a file nobody rotates.
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
