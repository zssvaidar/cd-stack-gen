; project-9 production-leaning php.ini overrides, loaded from
; /usr/local/etc/php/conf.d/zz-app.ini (the "zz-" prefix makes it load last,
; after the distro/base-image defaults, so these values win).
;
; Split from php-fpm pool config (www.conf) on purpose: this file is PHP
; engine settings; www.conf is process-manager and per-pool settings. Mixing
; them makes it harder to know which one to edit later.

; --- Errors: never show them to a client in prod, always log them ---
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Resource limits ---
memory_limit = 256M
max_execution_time = 30
max_input_time = 60
post_max_size = 32M
upload_max_filesize = 16M

; --- OPcache: on and validated in dev, on and NOT re-validating in prod ---
; APP_ENV switches this at the entrypoint (see docker-entrypoint.sh) by
; dropping a second conf.d file - this file only sets the safe shared
; defaults, both envs inherit these.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.interned_strings_buffer = 16

; --- Session: never trust client-supplied session IDs ---
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

; --- Don't leak the PHP version in response headers ---
expose_php = Off

; PHP's own default (on Debian/Ubuntu packaging, "GPCS") excludes "E", so
; $_ENV would stay empty even with php-fpm's clear_env=no letting getenv()
; see the process environment. Laravel's dotenv (vlucas/phpdotenv) and this
; project's own app/src/HealthCheck.php both read $_ENV directly, so this
; needs to be explicit rather than relying on a distro default that varies.
variables_order = "EGPCS"

; --- Timezone: explicit, don't rely on the OS default drifting between hosts ---
date.timezone = UTC

; realpath cache: fewer stat() calls per request behind a reverse proxy under load
realpath_cache_size = 4096K
realpath_cache_ttl = 600
