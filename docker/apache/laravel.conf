# Apache alternative to docker/nginx/default.conf, proxying to the SAME
# php-fpm container via mod_proxy_fcgi instead of mod_php. Deliberately not
# mod_php: mod_php runs PHP inside Apache's worker processes (one php-fpm-
# equivalent per web server, can't share it with anything else, and ties
# PHP's process model to Apache's MPM); proxy_fcgi keeps PHP as an
# independent, poolable process exactly like the nginx setup does, so
# switching servers is a genuine drop-in choice, not a different PHP setup.
<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        DirectoryIndex index.php

        # Laravel's front-controller rewrite (same effect as nginx's try_files).
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://php:9000"
    </FilesMatch>

    # Same defense-in-depth as the nginx config: dotfiles never served even
    # if the document root is ever misconfigured to include them.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <Location "/healthz">
        SetHandler none
        ProxyPass "!"
    </Location>
    Alias /healthz /var/www/html/public/healthz.txt

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
