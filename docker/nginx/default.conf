# Nginx front end, proxying PHP to the php-fpm container over FastCGI on
# port 9000 (docker-compose.yml's "php" service). document root is public/
# with Laravel's standard front-controller rewrite - this file works
# unmodified against a real Laravel app, not just the mock one in app/.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 32m;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Laravel routes everything through index.php; anything that isn't a
    # real file falls through to it with the original URI as PATH_INFO.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Answered directly by nginx, never proxied to php-fpm, so the
    # container's own HEALTHCHECK (Dockerfile) can tell "nginx is up" apart
    # from "nginx is up but php-fpm isn't" - deploy scripts check the latter
    # separately before flipping traffic (see ../../scripts/deploy.sh).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }

    # Never serve dotfiles (.env, .git, etc.) even if something misconfigures
    # the document root - defense in depth, not a substitute for keeping
    # .env out of the image in the first place (see docker-entrypoint.sh).
    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
        # Deliberately NOT forwarding client-supplied PATH_INFO/PATH_TRANSLATED
        # untouched - fastcgi_split_path_info below keeps this to what
        # index.php actually expects and avoids a classic PHP-FPM CGI
        # path-injection footgun.
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
    }

    location ~ /\.ht {
        deny all;
    }
}
